<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f1ff">
  <title>한국어 Flashcards — Вхід</title>
  <link rel="stylesheet" href="./login-style.css?v=5.0.6">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="login-hero" aria-hidden="true">
        <img src="./login-korea.png?v=5.0.6" alt="">
      </div>

      <div class="login-content">
        <div class="brand">
          <div class="brand-ko">한국어</div>
          <h1>Flashcards</h1>
          <p>Твій особистий тренажер корейської</p>
        </div>

        <div id="choiceView">
          <button class="main-action" data-open="register" type="button">🌸 Новий аккаунт</button>
          <button class="main-action outline" data-open="login" type="button">🔐 Логін</button>
          <p class="little-ko">공부해요! 🌸 <span>Давай вчитися разом!</span></p>
        </div>

        <section id="loginView" class="auth-view" hidden>
          <button class="back-link" data-back type="button">← Назад</button>
          <h2>Логін</h2>
          <p class="subtitle">Раді бачити тебе знову!</p>
          <form id="loginForm">
            <label>Email
              <input id="loginEmail" type="email" required autocomplete="email" placeholder="name@example.com">
            </label>
            <label>Пароль
              <input id="loginPassword" type="password" required autocomplete="current-password" placeholder="••••••••">
            </label>
            <button class="text-button" id="forgotPassword" type="button">Забула пароль?</button>
            <button class="main-action" type="submit">Увійти</button>
          </form>
        </section>

        <section id="registerView" class="auth-view" hidden>
          <button class="back-link" data-back type="button">← Назад</button>
          <h2>Новий аккаунт</h2>
          <p class="subtitle">Створи свій простір для вивчення корейської мови</p>
          <form id="registerForm">
            <label>Email
              <input id="registerEmail" type="email" required autocomplete="email" placeholder="name@example.com">
            </label>
            <label>Пароль
              <input id="registerPassword" type="password" minlength="6" required autocomplete="new-password" placeholder="Мінімум 6 символів">
            </label>
            <label>Повтори пароль
              <input id="registerPassword2" type="password" minlength="6" required autocomplete="new-password" placeholder="Повтори пароль">
            </label>
            <button class="main-action" type="submit">Створити аккаунт</button>
          </form>
        </section>

        <section id="recoveryView" class="auth-view" hidden>
          <h2>Новий пароль</h2>
          <p class="subtitle">Введи новий пароль для свого аккаунта.</p>
          <form id="recoveryForm">
            <label>Новий пароль
              <input id="recoveryPassword" type="password" minlength="6" required autocomplete="new-password">
            </label>
            <label>Повтори пароль
              <input id="recoveryPassword2" type="password" minlength="6" required autocomplete="new-password">
            </label>
            <button class="main-action" type="submit">Зберегти пароль</button>
          </form>
        </section>

        <div id="authMessage" class="message" hidden></div>
        <div class="version">PRO 5.0.6 · 29.08.2026</div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./login.js?v=5.0.6"></script>
</body>
</html>
